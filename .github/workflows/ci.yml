name: Qualité et Docker

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Installer les dépendances
        run: python -m pip install --requirement requirements-dev.txt
      - name: Vérifier le code
        run: ruff check app tests scripts
      - name: Exécuter les tests et mesurer la couverture
        run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Vérifier JavaScript et la logique de l’interface
        run: |
          node --check app/web/app.js
          node --check app/web/model.mjs
          node --check app/web/guide.js
          node --check app/web/tour.js
          node --test tests/test_web_logic.mjs
      - name: Vérifier la syntaxe du script Windows
        shell: pwsh
        run: |
          $jetons = $null
          $erreurs = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/verifier-windows.ps1'), [ref]$jetons, [ref]$erreurs
          )
          if ($erreurs) { throw ($erreurs -join "`n") }
      - name: Construire l’image
        run: docker build --tag gestion-stages-api:ci .
      - name: Vérifier le port Render et les routes dans le conteneur
        run: |
          docker run --detach --name gestion-stages-ci --env PORT=10000 --publish 127.0.0.1:8000:10000 gestion-stages-api:ci
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 1 --retry-max-time 60 --connect-timeout 2 --max-time 5 http://127.0.0.1:8000/health
          python scripts/verifier_service.py http://127.0.0.1:8000
      - name: Collecter les journaux et supprimer le conteneur
        if: always()
        run: |
          if docker container inspect gestion-stages-ci > /dev/null 2>&1; then
            docker logs gestion-stages-ci
            docker rm --force gestion-stages-ci
          fi
